<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CallSpace</title>
<style>
:root{--bg:#090c14;--panel:#171d2b;--line:#30394d;--text:#f7f8ff;--muted:#aab4c9;--purple:#8274ff;--green:#20c878;--red:#f04452}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:480px;margin:auto;min-height:100dvh;background:#101522;position:relative;overflow:hidden}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #252d40}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#a69aff,#6254dc);font-size:21px}.topbuttons{display:flex;gap:7px}button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:#283148;color:var(--text);cursor:pointer}button:active{transform:scale(.98)}.fullscreen{font-size:19px;padding:9px 11px}.export{font-size:12px;padding:9px}.content{padding:15px;}.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#0c111d;color:var(--text);margin-bottom:13px;outline:none}.contacts{display:flex;flex-direction:column;gap:9px}.contact{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid #252e42;border-radius:17px;padding:12px}.avatar{width:47px;height:47px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#897cff,#3997c8);overflow:hidden}.avatar img,.callavatar img{width:100%;height:100%;object-fit:cover;display:block}.callavatar{overflow:hidden}.info{min-width:0;flex:1}.info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.info small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.start{background:var(--green);color:#062b1a;font-weight:800;border-radius:999px;padding:11px 13px;white-space:nowrap}.form{margin-top:17px;background:var(--panel);border:1px solid #2a344a;border-radius:19px;padding:15px;display:grid;gap:9px}.form h2{font-size:17px;margin:0 0 2px}.form input[type=text],.form input[type=tel],.form input[type=search]{width:100%;padding:11px 12px;border:1px solid #3a455d;border-radius:11px;background:#0c111d;color:var(--text)}.image-picks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.image-pick{border:1px solid #38435a;border-radius:12px;padding:10px;background:#101624;min-width:0}.image-pick label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.photo-action{position:relative;width:100%}.image-pick input[type=file]{display:block;position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0}.choose-photo{pointer-events:none;width:100%;padding:9px 7px;background:#2b3550;border:1px solid #46516d;border-radius:9px;font-size:12px}.photo-name{display:block;font-size:10px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.formactions{display:flex;gap:8px}.formactions button{flex:1}.primary{background:var(--purple);font-weight:750}.hidden{display:none!important}.empty{padding:22px;text-align:center;color:var(--muted)}.call-screen{height:100dvh;min-height:520px;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 18px);background:#090d17}.calltop{display:flex;justify-content:flex-end;min-height:38px}.callperson{text-align:center;margin:4px 0 15px}.callavatar{width:86px;height:86px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:30px;font-weight:800;background:linear-gradient(135deg,#8c7cff,#3a94bc)}.callperson h2{margin:0;font-size:24px}.callperson p{margin:5px 0;color:var(--muted)}.image-stage{position:relative;flex:1;min-height:0;border-radius:27px;overflow:hidden;touch-action:none;background:linear-gradient(135deg,#4e4b9a,#252f58 55%,#246a78);border:1px solid #38425c;user-select:none}.image-stage img{width:100%;height:100%;object-fit:cover;display:block}.image-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(135deg,#4e4b9a,#252f58 55%,#246a78)}.image-fallback .emoji{font-size:clamp(90px,24vw,145px)}.image-fallback h3{font-size:27px;margin:12px 0 0}.image-fallback p{color:#e0e5ff}.endcall{flex-shrink:0;margin-top:10px;width:100%;min-height:58px;border-radius:999px;background:#f04452;color:white;font-weight:850;font-size:17px;box-shadow:0 5px 18px #f0445240}.callperson{text-align:center;margin:0 0 9px}.image-stage{margin-bottom:2px}.ringing{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ringing .ringicon{font-size:78px;animation:ring 1.1s ease-in-out infinite}.ringing h2{font-size:28px;margin:20px 0 4px}.ringing p{color:var(--muted)}@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}body.in-call{background:#090d17}body.in-call .app{max-width:480px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f7f8ff;color:#171a25;border-radius:12px;padding:11px 15px;display:none;z-index:20;box-shadow:0 8px 30px #0007}@media(min-width:600px){body{padding:16px 0}.app{border:1px solid #283148;border-radius:28px;min-height:calc(100dvh - 32px)}.call-screen{height:calc(100dvh - 34px);border-radius:27px}}
</style></head><body><div class="app" id="app">
<header class="top" id="header"><div class="brand"><span class="logo">☎</span><span>CallSpace</span></div><div class="topbuttons"><button class="export" id="exportBtn">Export</button><button class="export" id="importBtn">Import</button><button class="fullscreen" id="fullscreenBtn" aria-label="Fullscreen" title="Fullscreen">⛶</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header>
<main class="content" id="contactsPanel"><div id="storageStatus" style="font-size:11px;color:var(--muted);margin:0 0 10px">Saving contacts on this device…</div><input id="search" class="search" placeholder="Search contacts…" aria-label="Search contacts"><div id="contacts" class="contacts"></div>
<form id="contactForm" class="form"><h2 id="formTitle">Add contact</h2><input id="name" type="text" placeholder="Contact name *" maxlength="80" required><input id="phone" type="tel" placeholder="Phone number" maxlength="40"><div style="font-size:12px;color:var(--muted)">Choose a profile picture and call images (optional)</div><div class="image-pick"><label>Profile picture</label><div class="photo-action"><button type="button" class="choose-photo">🖼 Choose profile picture</button><input id="imgProfile" type="file" accept="image/*,.heic,.heif" aria-label="Choose contact profile picture"></div><span class="photo-name" id="imgProfileName">No image selected</span></div><div class="image-picks"><div class="image-pick"><label>Original image</label><div class="photo-action"><button type="button" class="choose-photo">🖼 Choose from Photos</button><input id="imgOriginal" type="file" accept="image/*,.heic,.heif" aria-label="Choose original image from photos"></div><span class="photo-name" id="imgOriginalName">No image selected</span></div><div class="image-pick"><label>Left image</label><div class="photo-action"><button type="button" class="choose-photo">🖼 Choose from Photos</button><input id="imgLeft" type="file" accept="image/*,.heic,.heif" aria-label="Choose left image from photos"></div><span class="photo-name" id="imgLeftName">No image selected</span></div><div class="image-pick"><label>Right image</label><div class="photo-action"><button type="button" class="choose-photo">🖼 Choose from Photos</button><input id="imgRight" type="file" accept="image/*,.heic,.heif" aria-label="Choose right image from photos"></div><span class="photo-name" id="imgRightName">No image selected</span></div><div class="image-pick"><label>Back image</label><div class="photo-action"><button type="button" class="choose-photo">🖼 Choose from Photos</button><input id="imgBack" type="file" accept="image/*,.heic,.heif" aria-label="Choose back image from photos"></div><span class="photo-name" id="imgBackName">No image selected</span></div></div><div class="formactions"><button class="primary" id="saveBtn" type="submit">Save contact</button><button id="cancelBtn" type="button" class="hidden">Cancel</button></div></form></main>
<section id="callScreen" class="call-screen hidden" aria-label="Call screen"><div class="calltop"><button class="fullscreen" id="callFullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button></div><div id="ringing" class="ringing"><div class="callavatar" id="ringAvatar">?</div><div class="ringicon">☎</div><h2 id="ringTitle">Calling…</h2><p id="ringPhone"></p></div><div id="connected" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="callperson"><div class="callavatar" id="callAvatar">?</div><h2 id="callName"></h2><p id="callPhone"></p></div><div class="image-stage" id="imageStage"><div class="image-fallback" id="imageFallback"><div class="emoji" id="fallbackEmoji">☎️</div><h3 id="fallbackTitle">Connected</h3><p id="fallbackSub">Swipe to change image</p></div><img id="callImage" class="hidden" alt="Call image"></div></div><button class="endcall" id="endCall">End call</button></section>
</div><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
(()=>{
const KEY='callspace.contacts.v1', DB_NAME='CallSpacePersistentStore', DB_STORE='contactBackups';const $=id=>document.getElementById(id);let contacts=read(),selectedId=null,editingId=null,callActive=false,connected=false,callTimer=null,gestureX=0,gestureY=0,slot='original';let callContact=null;let dbPromise=null;
const defaultImages={original:'',left:'',right:'',back:''};
function cleanContacts(a){return Array.isArray(a)?a.filter(c=>c&&c.id&&c.name).map(c=>({...c,images:{...defaultImages,...(c.images||{})}})):[]}
function read(){try{return cleanContacts(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return []}}
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB is unavailable'));return}let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open persistent storage'))});return dbPromise}
async function saveToDB(list){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({id:'contacts',savedAt:Date.now(),contacts:list});tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('Could not write contact backup'));tx.onabort=()=>reject(tx.error||new Error('Contact backup was interrupted'))})}
async function loadFromDB(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get('contacts');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch{return null}}
function save(){let localOk=false;try{localStorage.setItem(KEY,JSON.stringify(contacts));localOk=true}catch(e){}saveToDB(contacts).then(()=>{const status=$('storageStatus');if(status)status.textContent='Contacts saved on this device';}).catch(()=>{const status=$('storageStatus');if(status)status.textContent=localOk?'Contacts saved in browser storage':'Storage is restricted here — use Export to back up contacts';});if(localOk){$('storageStatus').textContent='Contacts saved on this device';return true}$('storageStatus').textContent='Saving backup…';toast('Browser storage is restricted. Trying persistent backup; export contacts as a backup too.');return true} 
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function initials(s){return (s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function getCurrent(){return contacts.find(c=>c.id===selectedId)||null}
function setAvatar(el,name,src){el.innerHTML='';if(src){const im=document.createElement('img');im.src=src;im.alt=name+' profile picture';im.onerror=()=>{el.textContent=initials(name)};el.appendChild(im)}else el.textContent=initials(name)}
function renderContacts(){let q=$('search').value.trim().toLowerCase(),arr=contacts.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)),box=$('contacts');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">No contacts yet. Add one below.</div>';return}for(let c of arr){let row=document.createElement('div');row.className='contact';let av=document.createElement('div');av.className='avatar';setAvatar(av,c.name,c.profilePicture||'');let info=document.createElement('div');info.className='info';let nm=document.createElement('strong');nm.textContent=c.name;let ph=document.createElement('small');ph.textContent=c.phone||'No phone number';info.append(nm,ph);let start=document.createElement('button');start.className='start';start.textContent='☎ Call';start.addEventListener('click',()=>startCall(c));let edit=document.createElement('button');edit.textContent='⋯';edit.title='Edit or delete contact';edit.style.padding='9px 11px';edit.addEventListener('click',()=>{selectedId=c.id;fillForm(c)});row.append(av,info,start,edit);box.append(row)}}
async function readFile(file){
 if(!file)return null;
 // HEIC/HEIF is not decoded by many embedded Android preview browsers. Convert it
 // locally in the browser to JPEG before using the same compression/storage path.
 const looksHeic=/\.(heic|heif)$/i.test(file.name||'')||/image\/(heic|heif|heic-sequence|heif-sequence)/i.test(file.type||'');
 let inputBlob=file;
 if(looksHeic){
   if(typeof window.heic2any!=='function')throw new Error('HEIC support could not load. Connect to the internet, reopen this HTML file, and try again. If WebCode blocks external scripts, convert the photo to JPG first.');
   try{inputBlob=await window.heic2any({blob:file,toType:'image/jpeg',quality:0.88});if(Array.isArray(inputBlob))inputBlob=inputBlob[0];if(!(inputBlob instanceof Blob))throw new Error('No converted image was returned.');}
   catch(e){throw new Error('Could not convert this HEIC photo. Try another photo or convert it to JPG. '+(e&&e.message?e.message:''));}
 }
 // Convert selected photos to a compact JPEG before saving. Large phone photos can
 // exceed WebCode/WebView localStorage limits, which previously made images vanish.
 const source=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('The selected image could not be read.'));r.readAsDataURL(inputBlob)});
 const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('This image format could not be opened. Try a JPG or PNG photo.'));im.src=source});
 const maxSide=1200,scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
 const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Image processing is not supported in this preview.');ctx.drawImage(img,0,0,canvas.width,canvas.height);
 let result=canvas.toDataURL('image/jpeg',0.78);if(result.length>1800000)result=canvas.toDataURL('image/jpeg',0.62);return result;
}
function resetForm(){editingId=null;$('contactForm').reset();for(let id of ['imgProfile','imgOriginal','imgLeft','imgRight','imgBack'])$(id+'Name').textContent='No new image selected';$('formTitle').textContent='Add contact';$('saveBtn').textContent='Save contact';$('cancelBtn').classList.add('hidden')}
function fillForm(c){editingId=c.id;$('name').value=c.name||'';$('phone').value=c.phone||'';$('imgProfile').value='';$('imgProfileName').textContent=c.profilePicture?'Current profile picture saved · choose to replace':'No profile picture saved';for(let id of ['imgOriginal','imgLeft','imgRight','imgBack']){$(id).value='';$(id+'Name').textContent=(c.images&&c.images[{imgOriginal:'original',imgLeft:'left',imgRight:'right',imgBack:'back'}[id]])?'Current image saved · choose to replace':'No image saved'}$('formTitle').textContent='Edit contact';$('saveBtn').textContent='Update contact';$('cancelBtn').classList.remove('hidden')}
$('contactForm').addEventListener('submit',async e=>{e.preventDefault();let name=$('name').value.trim();if(!name)return;let wasEditing=!!editingId,old=contacts.find(c=>c.id===editingId);let images={...(old?.images||defaultImages)};let profilePicture=old?.profilePicture||'';const saveBtn=$('saveBtn');saveBtn.disabled=true;saveBtn.textContent='Processing images…';try{if($('imgProfile').files[0])profilePicture=await readFile($('imgProfile').files[0]);for(let [id,key] of [['imgOriginal','original'],['imgLeft','left'],['imgRight','right'],['imgBack','back']]){let f=$(id).files[0];if(f)images[key]=await readFile(f)}let obj={id:editingId||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),name,phone:$('phone').value.trim(),profilePicture,images};let previous=contacts;contacts=wasEditing?contacts.map(c=>c.id===obj.id?obj:c):[...contacts,obj];if(!save()){contacts=previous;return}selectedId=obj.id;renderContacts();resetForm();toast(wasEditing?'Contact updated':'Contact added')}catch(err){toast(err?.message||'Could not process one of those images. Try a JPG or PNG photo.')}finally{saveBtn.disabled=false;saveBtn.textContent=editingId?'Update contact':'Save contact'}});
$('cancelBtn').addEventListener('click',resetForm);$('search').addEventListener('input',renderContacts);
// The image inputs are directly tappable transparent overlays above the styled buttons.
// This avoids programmatic clicks on hidden file inputs, which can be unreliable in Android WebView previews.
for(let id of ['imgProfile','imgOriginal','imgLeft','imgRight','imgBack'])$(id).addEventListener('change',()=>{$(id+'Name').textContent=$(id).files[0]?.name||'No image selected'});
function showSlot(which){slot=which;const image=$('callImage'),fallback=$('imageFallback');const img=(callContact?.images||{})[which]||'';const labels={original:['☎️','Call connected'],left:['🌸','Left image'],right:['🌊','Right image'],back:['🌌','Back image']};const showFallback=(message)=>{image.classList.add('hidden');fallback.classList.remove('hidden');$('fallbackEmoji').textContent=labels[which][0];$('fallbackTitle').textContent=labels[which][1];$('fallbackSub').textContent=message};image.onload=()=>{if(callActive&&slot===which){image.classList.remove('hidden');fallback.classList.add('hidden')}};image.onerror=()=>{image.removeAttribute('src');showFallback('This saved image could not be displayed. Edit this contact and choose the image again.')};if(!img){image.removeAttribute('src');showFallback('Choose an image for this position in the contact editor.');return}showFallback('Loading image…');image.src=img;if(image.complete&&image.naturalWidth>0){image.classList.remove('hidden');fallback.classList.add('hidden')}}
function startCall(c){if(callActive)return;callContact=c;selectedId=c.id;callActive=true;connected=false;slot='original';$('header').classList.add('hidden');$('contactsPanel').classList.add('hidden');$('callScreen').classList.remove('hidden');document.body.classList.add('in-call');setAvatar($('ringAvatar'),c.name,c.profilePicture||'');$('ringTitle').textContent='Calling '+c.name+'…';$('ringPhone').textContent=c.phone||'';setAvatar($('callAvatar'),c.name,c.profilePicture||'');$('callName').textContent=c.name;$('callPhone').textContent=c.phone||'';$('ringing').classList.remove('hidden');$('connected').classList.add('hidden');$('endCall').textContent='End call';callTimer=setTimeout(()=>{if(!callActive)return;connected=true;$('ringing').classList.add('hidden');$('connected').classList.remove('hidden');showSlot('original')},3000)}
function endCall(){callActive=false;connected=false;clearTimeout(callTimer);$('callScreen').classList.add('hidden');$('header').classList.remove('hidden');$('contactsPanel').classList.remove('hidden');document.body.classList.remove('in-call');callContact=null}
$('endCall').addEventListener('click',endCall);
const stage=$('imageStage');stage.addEventListener('pointerdown',e=>{gestureX=e.clientX;gestureY=e.clientY;try{stage.setPointerCapture(e.pointerId)}catch{}});stage.addEventListener('pointerup',e=>{if(!callActive||!connected)return;let dx=e.clientX-gestureX,dy=e.clientY-gestureY;if(Math.abs(dy)>38&&Math.abs(dy)>Math.abs(dx)*1.1){showSlot('original');return}if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.1){if(dx<0){/* Swipe left: original -> left, left -> back, right -> original, back -> right. */if(slot==='original')showSlot('left');else if(slot==='left')showSlot('back');else if(slot==='right')showSlot('original');else if(slot==='back')showSlot('right')}else{/* Swipe right: original -> right, right -> back, left -> original, back -> left. */if(slot==='original')showSlot('right');else if(slot==='right')showSlot('back');else if(slot==='left')showSlot('original');else if(slot==='back')showSlot('left')}}});
async function fullscreen(){try{if(!document.fullscreenElement)await $('app').requestFullscreen();else await document.exitFullscreen()}catch{toast('Fullscreen is not available in this browser.')}}$('fullscreenBtn').addEventListener('click',fullscreen);$('callFullscreenBtn').addEventListener('click',fullscreen);
$('exportBtn').addEventListener('click',()=>{const payload=JSON.stringify({app:'CallSpace',version:2,contacts},null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.saveExport==='function'){window.AndroidBridge.saveExport('callspace-contacts.json',payload);return}let blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='callspace-contacts.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.contacts;if(!Array.isArray(arr))throw Error();let added=arr.filter(c=>c&&typeof c.name==='string'&&c.name.trim()).map(c=>({id:(crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()),name:c.name.trim().slice(0,80),phone:String(c.phone||'').slice(0,40),profilePicture:String(c.profilePicture||''),images:{...defaultImages,...(c.images||{})}}));if(!confirm('Add '+added.length+' contacts from this file?'))return;contacts.push(...added);save();renderContacts();toast('Contacts imported')}catch{toast('That contact file could not be imported.')}finally{e.target.value=''}});
async function restorePersistentBackup(){const backup=await loadFromDB();if(backup&&Array.isArray(backup.contacts)&&backup.contacts.length){const local=read();if(!local.length){contacts=cleanContacts(backup.contacts);try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch{}toast('Your saved contacts were restored');}}renderContacts();const status=$('storageStatus');if(status){status.textContent=contacts.length?'Contacts loaded · saved on this device':'Contacts saved on this device';} }
renderContacts();restorePersistentBackup();
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){};saveToDB(contacts).catch(()=>{});});
})();
</script></body></html>
